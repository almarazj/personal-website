# Deploy, run by CodeBuild on every push to main.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g corepack && corepack enable
      - pnpm install --frozen-lockfile

  build:
    commands:
      - pnpm build
      # Hashed assets never change; other files are cached at the edge until the next invalidation.
      - '[ ! -d dist/_astro ] || aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"'
      # _astro is excluded from --delete so pages still cached in browsers keep their assets.
      - aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" --cache-control "public, max-age=0, s-maxage=31536000"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
